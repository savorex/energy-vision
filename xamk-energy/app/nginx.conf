# frontend-nginx.conf — lives in the frontend image (frontend/nginx.conf).
# Serves the static build and proxies API calls to the backend container.

server {
    listen 80;
    server_name _;
    server_tokens off;

    # --- API → backend container (PORT 3000) -------------------------------
    # Backend must expect its routes under /api/ (e.g. /api/users).
    # If it serves routes at the root instead, add a prefix here:
    #   rewrite ^/api/(.*)$ /$1 break;   (before proxy_pass)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # --- Static SPA ---------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed build assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}