server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # /energy-vision (no trailing slash) → redirect to the canonical URL
    location = /energy-vision {
        return 301 /energy-vision/;
    }

    # Frontend proxied to :6767 — trailing slash strips the prefix,
    # so :6767 serves the app at its root
    location ^~ /energy-vision/ {
        proxy_pass http://localhost:6767/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API — strip the /energy-vision prefix before proxying
    location ^~ /energy-vision/api/ {
        proxy_pass http://127.0.0.1:6768/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long polling / websockets (remove if not needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Root serves whatever the bare-metal box hosts directly (optional — keep or drop)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed build assets — host-rooted assets only;
    # /energy-vision/ assets are handled entirely by the ^~ block above
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
