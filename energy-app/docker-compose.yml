services:
  frontend:
    build: ./app
    container_name: ${APP_NAME:-savorex-energy}-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:6767:80"
    depends_on:
      - backend
  backend:
    container_name: ${APP_NAME:-savorex-energy}-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: ${PORT}
    build:
      context: api
      target: builder
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8
    container_name: ${APP_NAME:-savorex-energy}-db
    restart: unless-stopped
    environment:
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
