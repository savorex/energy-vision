# Container: serves the SPA over plain HTTP only. TLS is terminated by the host.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static assets: don't cache index.html, cache assets hard
    location ~* \.(js|css|png|jpg|jpeg|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # SPA fallback: any app route serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}